     <main>

    <h1>Vehicle Enquiries</h1>

    <p>
        Do you have a question about one of the vehicles featured
        on AutoBuyersChoice? Please Complete the form below and send us
        your enquiry.
    </p>

    <form>

        <label for="name">Your Full Name:</label><br>
        <input type="text" id="name" name="name">

        <br><br>

        <label for="email">Your Email Address:</label><br>
        <input type="email" id="email" name="email">

        <br><br>

        <label for="vehicle">Select Desired Vehicle:</label><br>

        <select id="vehicle" name="vehicle">

            <option>Polo TSI</option>
            <option>BMW X7</option>
            <option>Toyota LandCruiser</option>
            <option>Mercedes-Benz V-Class</option>

        </select>

        <br><br>

        <label for="topic">What would you like to know about</label><br>

        <select id="topic" name="topic">

            <option>Price</option>
            <option>Performance</option>
            <option>Fuel Economy</option>
            <option>Reliability</option>
            <option>Features</option>
            <option>Other</option>

        </select>

        <br><br>

        <label for="message">Your Quiry:</label><br>

        <textarea id="message" name="message" rows="6" cols="40"></textarea>

        <br><br>

        <input type="submit" value="Submit Enquiry">

    </form>

</main>
